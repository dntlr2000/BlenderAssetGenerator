name: Blender smoke

on:
  workflow_dispatch:
    inputs:
      execute_blender_smoke:
        description: Run only when a labeled Windows Blender 5 runner is available
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blender-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blender:
    name: Blender 5 Windows smoke
    if: ${{ inputs.execute_blender_smoke == true }}
    runs-on:
      - self-hosted
      - windows
      - blender5
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync locked dependencies
        shell: pwsh
        run: uv sync --frozen --extra dev --extra vision

      - name: Record runner and Blender compatibility
        shell: pwsh
        run: |
          uv run cbm doctor
          uv run cbm blender-compat

      - name: Run instruction and registry parity
        shell: pwsh
        run: |
          uv run python scripts/check_agent_instructions.py
          uv run python scripts/generate_repository_summary.py --check

      - name: Run AQ and legacy Blender evidence gates
        shell: pwsh
        run: >
          ./scripts/run_autonomous_quality_gates.ps1
          -RunBlender

      - name: Preserve not-run semantics
        if: ${{ cancelled() }}
        shell: pwsh
        run: |
          Write-Output "Blender smoke was cancelled; no passing status may be inferred."
